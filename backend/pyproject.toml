[project]
name = "capital-os"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.121",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.122",
    "httpx>=0.28.1",
    "mypy-boto3-dynamodb>=1.43.116",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
