repos:
  - repo: local
    hooks:
      - id: backend-ruff-check
        name: Backend | Ruff Lint
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/
        pass_filenames: false

      - id: backend-ruff-format
        name: Backend | Ruff Format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/
        pass_filenames: false

      - id: backend-pytest
        name: Backend | Pytest
        entry: uv run --directory backend pytest -q
        language: system
        files: ^backend/
        pass_filenames: false